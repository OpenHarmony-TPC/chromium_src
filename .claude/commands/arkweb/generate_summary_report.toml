# .claude/commands/arkweb/generate_summary_report.toml
description = "汇总某个文件夹下的解冲突总体报告"
prompt = """
你是一名负责汇总冲突解决报告的分析师。请按照以下要求完成报告生成任务：

[第一性原则:黄金法则]
这是本次任务的最高优先级，必须无条件遵守:

绝对禁止:
1,在任何非指定目录创建文件.
2,生成任何形式的脚本文件（如 .sh, .py, .bat, .cmd 等）.
3,创建任何辅助文件、临时文件或工具文件.
4,使用外部工具或脚本来处理文件.
5,在指定目录外的任何位置创建文件.

唯一允许的操作:
- 仅在 {args1}/arkweb_144/src/claude_out/total_report/ 目录下创建指定的 Markdown 汇总报告文件
- 读取 {args1}/arkweb_144/src/claude_out/report/{args2}/ 目录下的 JSON 文件

违反以上任何一条规则将导致代码污染和引入未知风险，是本次任务的绝对失败.

[任务目标]
为指定文件夹下的所有冲突解决JSON文件生成一个汇总的Markdown报告。

[输入参数]
- 基础路径: {args1}
- 目标文件夹: {args2} 

[具体任务步骤]
1,文件搜索:仅在 {args1}/arkweb_144/src/claude_out/report/{args2}/ 目录中,递归查找所有JSON文件.
2,文件读取:逐一读取找到的所有JSON文件内容,提取其中的关键信息.
3,报告生成:创建一个Markdown格式的汇总报告,包含以下内容:
   - 报告标题:使用目标文件夹名称,"{args2} 目录冲突解决汇总报告"
   - 统计信息:总文件数量、成功解决数量、失败数量等
   - 文件列表:每个JSON文件的简要信息
   - 风险汇总:按风险等级分类的冲突文件
   - 处理建议:针对常见问题的建议
4,文件命名规则:
   - Markdown文件名:将{args2}中的路径分隔符"/"替换为下划线"_",然后添加"_allrej.md"后缀
5,文件保存位置:将生成的Markdown文件保存到 {args1}/arkweb_144/src/claude_out/total_report/ 目录下.
   - 注意:如果total_report目录不存在,需要先创建该目录.

[输出要求]
1,Markdown 汇总报告:必须在且仅在 {args1}/arkweb_144/src/claude_out/total_report/ 目录下创建一个markdown文件.
2,路径强制限制:
   - 绝对禁止在任何其他目录创建文件
   - 绝对禁止在当前工作目录创建文件
   - 绝对禁止在JSON文件相同目录创建文件
   - 绝对禁止在用户主目录创建文件
   - 绝对禁止在源文件目录创建文件
   - 唯一允许的创建路径: {args1}/arkweb_144/src/claude_out/total_report/
3,文件命名规则:使用{args2}中的路径分隔符"/"替换为下划线"_",然后添加"_allrej.md"后缀.
4,报告语言:中文
5,报告格式:Markdown (.md)
6,内容要求:结构清晰,信息完整,便于人工阅读和分析
7,必须包含:所有JSON文件的核心信息汇总
8,严格限制:除了上述指定路径下的Markdown报告文件外，绝对禁止创建任何其他文件，特别是脚本文件、工具文件或临时文件.
9,路径验证:在创建文件前，必须验证完整路径是否为 {args1}/arkweb_144/src/claude_out/total_report/[文件名].md，如果不是，禁止创建.
"""