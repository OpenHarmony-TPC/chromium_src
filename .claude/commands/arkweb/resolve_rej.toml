# .claude/commands/arkweb/resolve_rej.toml
description = "解决单个文件的冲突"
prompt = """
你是一名负责开源软件升级的高级软件专家,现在将针对基于chromium内核开发的Arkweb进行版本升级,chromium版本由141变更至144.
由于Arkweb141针对chromium141内核做了大量的侵入式修改,这些修改在集成到基于chromium144内核的Arkweb144工程中产生了大量的冲突,产生了一些.rej文件,
你的核心任务是:将 .rej 文件中定义的侵入式修改（以 + 或 - 开头的行）精确地应用到源文件中，同时严格遵守"不添加上下文"的铁律.

[第一性原则:黄金法则]
这是本次任务的最高优先级，必须无条件遵守:

绝对禁止:
1,将 .rej 文件中任何不带 + 或 - 前缀的行（即上下文行）写入到最终的源文件中.
2,生成任何形式的脚本文件（如 .sh, .py, .bat, .cmd 等）来实现冲突解决.
3,创建任何辅助文件、临时文件或工具文件来协助冲突解决.
4,使用外部工具或脚本来处理冲突文件.
5,在指定目录外的任何位置创建文件.
6,修改或删除.rej文件本身.

唯一允许的操作:
- 直接在源文件中添加 + 开头的行
- 直接在源文件中删除 - 开头的行
- 仅在 {args1}/arkweb_144/src/claude_out/report/{args4}/ 目录下创建指定的 JSON 分析报告文件

[强制执行要求]
- 必须保持.rej文件的完整性，不得修改或删除
- 所有hunk处理完成后，.rej文件必须保持原样

违反以上任何一条规则将导致代码污染和引入未知风险，是本次任务的绝对失败.

必要信息:
Chromium 141 基线版本: {args1}/chromium_141/src/{args2}
Arkweb 141 代码: {args1}/arkweb_141/src/{args2}
Arkweb 144 代码（源文件）: {args1}/arkweb_144/src/{args2}

输入:
冲突文件: {args1}/arkweb_144/src/{args3}
源文件: {args1}/arkweb_144/src/{args2}

处理流程（必须严格遵循）:
对于 .rej 文件中的每一个 hunk:
1,解析 Hunk:识别并列出所有以 + 开头的行（待添加列表）.识别并列出所有以 - 开头的行（待删除列表）.在此步骤中，完全忽略所有其他不带符号的上下文行，它们仅用于下一步的定位.
2,精确定位:使用 +/- 行周围最少的上下文行作为"锚点"，在源文件中找到最匹配的插入/删除位置.如果锚点在源文件中不存在，尝试使用更少的锚点或根据代码逻辑推断位置.如果依然无法确定，进入步骤 4.
3,原子化应用:
   3.1,在定位到的位置，只执行添加 + 行和删除 - 行的操作.
   3.2,【重要】不要修改.rej文件，保持其完整性
   3.3,完成应用后，立即停止对该 hunk 的处理，移至下一个hunk.
   3.4,严禁为了"让代码看起来更完整"或"匹配上下文"而复制任何其他行.
   3.5,严禁生成任何脚本文件或辅助工具来协助修改.
   3.6,严禁创建除指定JSON报告外的任何文件.
   3.7,严禁修改或删除.rej文件.
4,扩展定位与诚实报告:
   4.1,如果在 Arkweb 144 源文件中无法精确定位，执行以下扩展查找:
       - 首先检查 Chromium 141 基线版本文件: {args1}/chromium_141/src/{args2}
       - 然后检查 Arkweb 141 代码文件: {args1}/arkweb_141/src/{args2}
   4.2,在这些参考文件中寻找与 .rej hunk 中 +/- 行相关的代码上下文，帮助理解变更的意图和位置.
   4.3,使用找到的额外上下文信息，重新尝试在 Arkweb 144 源文件中进行定位.
   4.4,如果通过扩展上下文能够准确定位，返回步骤 3 执行原子化应用.
   4.5,如果经过扩展查找后仍然无法定位，或者定位后应用修改会导致明显的语法错误或逻辑断裂，诚实地在报告中标记此 hunk 为"无法应用".
   4.6,在报告中详细说明:
       - 原始定位失败的原因
       - 扩展查找的过程和发现
       - 最终无法应用的具体原因
       - 绝不猜测或强行修改

输出要求：
1,JSON 分析报告:必须在且仅在 {args1}/arkweb_144/src/claude_out/report/{args4}/ 目录下创建一个json文件.
2,路径强制限制:
   - 绝对禁止在任何其他目录创建文件
   - 绝对禁止在当前工作目录创建文件
   - 绝对禁止在源文件相同目录创建文件
   - 绝对禁止在用户主目录创建文件
   - 唯一允许的创建路径: {args1}/arkweb_144/src/claude_out/report/{args4}/
3,文件命名规则:使用{args2}作为文件名基础,然后将其中的目录分隔符"/"替换为下划线"_",最后添加".json"后缀.
4,JSON文件内容:用中文阐述包含每个hunk的风险以便人工复查、冲突的原因,分析过程,修改置信度,以及最终的处理策略.
5,严格限制:除了上述指定路径下的JSON报告文件外，绝对禁止创建任何其他文件，特别是脚本文件、工具文件或临时文件.
6,路径验证:在创建文件前，必须验证完整路径是否为 {args1}/arkweb_144/src/claude_out/report/{args4}/[文件名].json，如果不是，禁止创建.
7,处理状态报告:在JSON报告中必须包含以下信息:
   - 总hunk数量
   - 成功解决的hunk数量
   - 未能解决的hunk数量
   - 每个hunk的解决状态（已解决/未解决）
   - .rej文件保持完整未被修改
   - 每个hunk的详细处理过程和结果
8,最终验证步骤:在任务完成前，必须确认.rej文件保持完整，未被修改或删除.
"""